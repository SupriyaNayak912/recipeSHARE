{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>
<body>
    <div class="signup-container">
        <div class="signup-form">
            <h2 class="signup-title">Sign up</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="signup-button">Sign Up</button>
            </form>
            <p class="login-link-container" style="margin-top: 15px; font-size: 14px; color: #8e8e8e; text-align: center;">
                Already have an account? <a href="{% url 'account_login' %}" style="color: #3897f0; text-decoration: none; font-weight: bold;">Log in</a>
            </p>
        </div>
    </div>
</body>
</html>
