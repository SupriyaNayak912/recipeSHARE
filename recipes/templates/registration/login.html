<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-form">
            <h2 class="login-title">Log in</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="login-button">Log In</button>
            </form>
            <p class="signup-link-container" style="margin-top: 15px; font-size: 14px; color: #8e8e8e; text-align: center;">
                Don't have an account? <a href="{% url 'account_signup' %}" style="color: #3897f0; text-decoration: none; font-weight: bold;">Sign up</a>
            </p>
        </div>
    </div>
</body>
</html>
